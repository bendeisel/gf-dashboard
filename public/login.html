<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Growth Factor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/app.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body class="login-body">
<!-- Step 1: username + password -->
<form id="step1" class="login-card">
  <img class="brand-mark" src="/logo-flame.png" alt="Growth Factor" width="52" height="52">
  <h1>Growth Factor</h1>
  <p class="muted">Command dashboard. Sign in to continue.</p>
  <label class="field">Username
    <input id="user" type="text" autocomplete="username" autocapitalize="none" autofocus required>
  </label>
  <label class="field">Password
    <input id="pw" type="password" autocomplete="current-password" required>
  </label>
  <div id="err1" class="err" role="alert"></div>
  <button class="btn primary" type="submit">Sign in</button>
</form>

<!-- Step 2: emailed one-time code -->
<form id="step2" class="login-card" hidden>
  <img class="brand-mark" src="/logo-flame.png" alt="Growth Factor" width="52" height="52">
  <h1>Check your email</h1>
  <p class="muted">We sent a 6-digit code to <b id="maskedEmail"></b>. It expires in 10 minutes.</p>
  <label class="field">Sign-in code
    <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" placeholder="123456" required>
  </label>
  <div id="err2" class="err" role="alert"></div>
  <button class="btn primary" type="submit">Verify &amp; sign in</button>
  <p class="muted" style="margin-top:12px">Didn’t get it? <a href="#" id="resend">Resend code</a> · <a href="#" id="back">Start over</a></p>
</form>

<script src="/login.js"></script>
</body>
</html>
